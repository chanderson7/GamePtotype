<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept A, "The Monogram": a letter B made of one brass pole and two cloths in the
       wind, the player's blue over the enemy's crimson, on night with a dawn glow. -->
  <defs>
    <radialGradient id="dawn" cx="512" cy="1000" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3b65c" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#8e5a6e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0e1322" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d476"/><stop offset="0.45" stop-color="#d9a944"/><stop offset="1" stop-color="#8a6324"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a7ae6"/><stop offset="1" stop-color="#2a4aa0"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d44c42"/><stop offset="1" stop-color="#8e2a22"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0e1322"/>
  <rect width="1024" height="1024" fill="url(#dawn)"/>
  <!-- Lower bowl: the larger cloth, with a swallowtail cut at its corner. -->
  <path d="M312 486 C 430 470, 540 498, 640 482 C 770 462, 832 540, 832 648 C 832 756, 770 832, 640 814 C 540 800, 430 826, 312 812 Z" fill="url(#red)"/>
  <path d="M312 486 C 430 470, 540 498, 640 482 C 770 462, 832 540, 832 648 C 832 756, 770 832, 640 814 C 540 800, 430 826, 312 812 Z" fill="none" stroke="#ffb7ae" stroke-width="5" stroke-linejoin="round" opacity="0.7"/>
  <!-- Upper bowl: the smaller cloth. -->
  <path d="M312 210 C 420 196, 520 224, 600 208 C 690 192, 740 250, 740 334 C 740 418, 690 470, 600 456 C 520 442, 420 470, 312 456 Z" fill="url(#blue)"/>
  <path d="M312 210 C 420 196, 520 224, 600 208 C 690 192, 740 250, 740 334 C 740 418, 690 470, 600 456 C 520 442, 420 470, 312 456 Z" fill="none" stroke="#a9c4ff" stroke-width="5" stroke-linejoin="round" opacity="0.7"/>
  <!-- Fold shadows, so the cloth has weight. -->
  <path d="M312 456 C 420 470, 520 442, 600 456 C 640 462, 680 450, 700 420 L 700 470 C 680 500, 640 508, 600 500 C 520 486, 420 514, 312 500 Z" fill="#0e1322" opacity="0.22"/>
  <path d="M640 482 C 770 462, 832 540, 832 648 C 832 756, 770 832, 640 814 L 640 780 C 740 790, 796 730, 796 648 C 796 566, 740 500, 640 516 Z" fill="#0e1322" opacity="0.18"/>
  <!-- The pole and its finial. -->
  <rect x="280" y="150" width="34" height="760" rx="4" fill="url(#pole)"/>
  <path d="M297 72 L324 150 L297 170 L270 150 Z" fill="#f3d476"/>
  <circle cx="297" cy="152" r="18" fill="#d9a944"/>
  <rect x="268" y="880" width="58" height="26" rx="6" fill="#8a6324"/>
  <!-- The Glass Sea, one line of it. -->
  <path d="M120 920 C 220 898, 300 942, 400 920 S 600 894, 700 922 S 860 944, 920 916" fill="none" stroke="#5dd0d8" stroke-width="9" stroke-linecap="round"/>
  <path d="M200 964 C 290 946, 360 980, 450 964 S 620 940, 720 966 S 820 980, 860 962" fill="none" stroke="#5dd0d8" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
</svg>
